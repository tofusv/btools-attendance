<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Sarabun', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    *, *::before, *::after, html, body, button, input, select, textarea, span, div, h1, h2, h3, p, a, label, b, strong {
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-[#F7F7F5] text-[#37352F] antialiased p-4 text-xs">

  <div class="bg-white rounded-[10px] border border-[#E9E9E7] shadow-none p-5 space-y-4 max-w-lg mx-auto">
    <!-- Header -->
    <div class="flex items-center gap-2.5 pb-3 border-b border-[#E9E9E7]">
      <div class="w-8 h-8 rounded-lg bg-[#E7F3F8] text-[#2383E2] flex items-center justify-center shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </div>
      <div>
        <h1 class="text-sm font-semibold text-[#37352F]">สร้างคลาสเรียน & คำนวณตาราง A4</h1>
        <p class="text-[11px] text-[#787774]">คำนวณวันหยุดไทย และสร้างแท็บชีตใหม่อัตโนมัติ</p>
      </div>
    </div>

    <!-- Form -->
    <form id="genForm" onsubmit="handleSubmit(event)" class="space-y-3.5">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[11px] font-medium text-[#37352F] mb-1">ชื่อคลาส (Sheet Name) <span class="text-[#D64545]">*</span></label>
          <input 
            type="text" 
            id="className" 
            value="Class_1" 
            required 
            placeholder="เช่น Class_1"
            class="w-full px-2.5 py-1.5 bg-[#F7F7F5] border border-[#E9E9E7] rounded-lg text-xs text-[#37352F] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#2383E2]"
          >
        </div>
        <div>
          <label class="block text-[11px] font-medium text-[#37352F] mb-1">ชื่อบริษัท (Company)</label>
          <input 
            type="text" 
            id="company" 
            value="B Tools Training" 
            placeholder="เช่น B Tools Training"
            class="w-full px-2.5 py-1.5 bg-[#F7F7F5] border border-[#E9E9E7] rounded-lg text-xs text-[#37352F] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#2383E2]"
          >
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-medium text-[#37352F] mb-1">หลักสูตร (Course Title) <span class="text-[#D64545]">*</span></label>
        <input 
          type="text" 
          id="course" 
          value="Professional English Communication" 
          required 
          placeholder="ชื่อหลักสูตร"
          class="w-full px-2.5 py-1.5 bg-[#F7F7F5] border border-[#E9E9E7] rounded-lg text-xs text-[#37352F] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#2383E2]"
        >
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[11px] font-medium text-[#37352F] mb-1">ระยะเวลา (Class Duration)</label>
          <input 
            type="text" 
            id="classDuration" 
            value="40 Hours" 
            placeholder="เช่น 40 Hours"
            class="w-full px-2.5 py-1.5 bg-[#F7F7F5] border border-[#E9E9E7] rounded-lg text-xs text-[#37352F] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#2383E2]"
          >
        </div>
        <div>
          <label class="block text-[11px] font-medium text-[#37352F] mb-1">สถานที่เรียน (Location)</label>
          <input 
            type="text" 
            id="location" 
            value="" 
            placeholder="เว้นว่างได้ หรือระบุห้องเรียน"
            class="w-full px-2.5 py-1.5 bg-[#F7F7F5] border border-[#E9E9E7] rounded-lg text-xs text-[#37352F] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#2383E2]"
          >
        </div>
      </div>

      <div class="pt-2 border-t border-[#F1F1EF] grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[11px] font-medium text-[#37352F] mb-1">วันเริ่มเรียน (Start Date) <span class="text-[#D64545]">*</span></label>
          <input 
            type="date" 
            id="startDate" 
            required 
            onchange="onInputUpdate()"
            class="w-full px-2.5 py-1.5 bg-[#F7F7F5] border border-[#E9E9E7] rounded-lg text-xs text-[#37352F] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#2383E2]"
          >
        </div>
        <div>
          <label class="block text-[11px] font-medium text-[#37352F] mb-1">จำนวนครั้งที่เรียน (Sessions) <span class="text-[#D64545]">*</span></label>
          <input 
            type="number" 
            id="totalSessions" 
            value="15" 
            min="1" 
            max="50" 
            required 
            onchange="onInputUpdate()"
            class="w-full px-2.5 py-1.5 bg-[#F7F7F5] border border-[#E9E9E7] rounded-lg text-xs font-semibold text-[#2383E2] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#2383E2]"
          >
        </div>
      </div>

      <!-- Days Selection -->
      <div>
        <label class="block text-[11px] font-medium text-[#37352F] mb-1.5">วันเรียนในสัปดาห์ (เลือกได้หลายวัน) <span class="text-[#D64545]">*</span></label>
        <div class="grid grid-cols-7 gap-1">
          <label class="inline-flex flex-col items-center justify-center p-1.5 rounded-lg border border-[#E9E9E7] bg-[#F7F7F5] text-[11px] text-[#37352F] cursor-pointer hover:bg-white transition text-center">
            <input type="checkbox" id="d1" value="1" onchange="onInputUpdate()" class="rounded text-[#2383E2] focus:ring-0 mb-0.5"> จ.
          </label>
          <label class="inline-flex flex-col items-center justify-center p-1.5 rounded-lg border border-[#E9E9E7] bg-[#F7F7F5] text-[11px] text-[#37352F] cursor-pointer hover:bg-white transition text-center">
            <input type="checkbox" id="d2" value="2" onchange="onInputUpdate()" class="rounded text-[#2383E2] focus:ring-0 mb-0.5"> อ.
          </label>
          <label class="inline-flex flex-col items-center justify-center p-1.5 rounded-lg border border-[#E9E9E7] bg-[#F7F7F5] text-[11px] text-[#37352F] cursor-pointer hover:bg-white transition text-center">
            <input type="checkbox" id="d3" value="3" checked onchange="onInputUpdate()" class="rounded text-[#2383E2] focus:ring-0 mb-0.5"> พ.
          </label>
          <label class="inline-flex flex-col items-center justify-center p-1.5 rounded-lg border border-[#E9E9E7] bg-[#F7F7F5] text-[11px] text-[#37352F] cursor-pointer hover:bg-white transition text-center">
            <input type="checkbox" id="d4" value="4" onchange="onInputUpdate()" class="rounded text-[#2383E2] focus:ring-0 mb-0.5"> พฤ.
          </label>
          <label class="inline-flex flex-col items-center justify-center p-1.5 rounded-lg border border-[#E9E9E7] bg-[#F7F7F5] text-[11px] text-[#37352F] cursor-pointer hover:bg-white transition text-center">
            <input type="checkbox" id="d5" value="5" onchange="onInputUpdate()" class="rounded text-[#2383E2] focus:ring-0 mb-0.5"> ศ.
          </label>
          <label class="inline-flex flex-col items-center justify-center p-1.5 rounded-lg border border-[#E9E9E7] bg-[#F7F7F5] text-[11px] text-[#37352F] cursor-pointer hover:bg-white transition text-center">
            <input type="checkbox" id="d6" value="6" onchange="onInputUpdate()" class="rounded text-[#2383E2] focus:ring-0 mb-0.5"> ส.
          </label>
          <label class="inline-flex flex-col items-center justify-center p-1.5 rounded-lg border border-[#E9E9E7] bg-[#F7F7F5] text-[11px] text-[#37352F] cursor-pointer hover:bg-white transition text-center">
            <input type="checkbox" id="d0" value="0" onchange="onInputUpdate()" class="rounded text-[#2383E2] focus:ring-0 mb-0.5"> อา.
          </label>
        </div>
      </div>

      <!-- Time Selection -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[11px] font-medium text-[#37352F] mb-1">เวลาเริ่ม (Start Time)</label>
          <input 
            type="time" 
            id="startTime" 
            value="13:30" 
            onchange="onInputUpdate()"
            class="w-full px-2.5 py-1.5 bg-[#F7F7F5] border border-[#E9E9E7] rounded-lg text-xs text-[#37352F] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#2383E2]"
          >
        </div>
        <div>
          <label class="block text-[11px] font-medium text-[#37352F] mb-1">เวลาเลิก (End Time)</label>
          <input 
            type="time" 
            id="endTime" 
            value="15:30" 
            onchange="onInputUpdate()"
            class="w-full px-2.5 py-1.5 bg-[#F7F7F5] border border-[#E9E9E7] rounded-lg text-xs text-[#37352F] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#2383E2]"
          >
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-medium text-[#787774] mb-1">ข้อความเวลาเรียน (Schedule Text)</label>
        <input 
          type="text" 
          id="scheduleText" 
          value="Wed at 13.30 PM. - 15.30 PM."
          class="w-full px-2.5 py-1.5 bg-[#F7F7F5] border border-[#E9E9E7] rounded-lg text-xs text-[#37352F] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#2383E2]"
        >
      </div>

      <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-[#EEF3ED] text-[#218C42] border border-[#B9DCC3] text-xs font-medium w-full">
        <span>🇹🇭 ข้ามวันหยุดไทยอัตโนมัติ พร้อมใส่หมายเหตุ Holiday ในตาราง A4</span>
      </div>

      <button 
        type="submit" 
        id="btnSubmit" 
        class="w-full py-2.5 bg-[#2383E2] hover:bg-[#1B6FC1] text-white text-xs font-semibold rounded-lg shadow-none transition cursor-pointer flex items-center justify-center gap-1.5"
      >
        <span>🚀 สร้างคลาส & คำนวณตารางวันเรียนทันที</span>
      </button>
    </form>
  </div>

  <script>
    const dayNames = {
      1: "Mon",
      2: "Tue",
      3: "Wed",
      4: "Thu",
      5: "Fri",
      6: "Sat",
      0: "Sun"
    };

    // Initialize Default Date
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    document.getElementById('startDate').value = `${yyyy}-${mm}-${dd}`;

    function formatTime12h(timeStr) {
      if (!timeStr) return "";
      const parts = timeStr.split(':');
      const h = parseInt(parts[0]);
      const m = parts[1];
      const ampm = h >= 12 ? 'PM.' : 'AM.';
      return `${parts[0]}.${m} ${ampm}`;
    }

    function onInputUpdate() {
      // Collect selected days
      const selected = [];
      const checkboxes = [
        document.getElementById('d1'),
        document.getElementById('d2'),
        document.getElementById('d3'),
        document.getElementById('d4'),
        document.getElementById('d5'),
        document.getElementById('d6'),
        document.getElementById('d0')
      ];

      checkboxes.forEach(cb => {
        if (cb && cb.checked) {
          selected.push(dayNames[cb.value]);
        }
      });

      const daysStr = selected.length > 0 ? selected.join(' & ') : 'Wed';
      const sTime = document.getElementById('startTime').value;
      const eTime = document.getElementById('endTime').value;

      const formattedStart = formatTime12h(sTime);
      const formattedEnd = formatTime12h(eTime);

      const generated = `${daysStr} at ${formattedStart} - ${formattedEnd}`;
      document.getElementById('scheduleText').value = generated;
    }

    function handleSubmit(e) {
      e.preventDefault();
      
      const selectedDays = [];
      const checkboxes = [
        document.getElementById('d1'),
        document.getElementById('d2'),
        document.getElementById('d3'),
        document.getElementById('d4'),
        document.getElementById('d5'),
        document.getElementById('d6'),
        document.getElementById('d0')
      ];

      checkboxes.forEach(cb => {
        if (cb && cb.checked) {
          selectedDays.push(parseInt(cb.value));
        }
      });

      if (selectedDays.length === 0) {
        alert("กรุณาเลือกวันเรียนในสัปดาห์อย่างน้อย 1 วัน");
        return;
      }

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = "⏳ กำลังคำนวณและสร้างชีต A4...";

      const startDateVal = document.getElementById('startDate').value;
      const startD = new Date(startDateVal);
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const startDateText = `${startD.getDate()} ${months[startD.getMonth()]}, ${startD.getFullYear()}`;

      const params = {
        className: document.getElementById('className').value,
        company: document.getElementById('company').value,
        course: document.getElementById('course').value,
        classDuration: document.getElementById('classDuration').value,
        location: document.getElementById('location').value,
        startDate: startDateVal,
        startDateText: startDateText,
        totalSessions: document.getElementById('totalSessions').value,
        daysOfWeek: selectedDays,
        scheduleText: document.getElementById('scheduleText').value
      };

      google.script.run
        .withSuccessHandler(function(res) {
          if (res.success) {
            google.script.host.close();
          } else {
            alert("เกิดข้อผิดพลาด: " + res.message);
            btn.disabled = false;
            btn.innerText = "🚀 สร้างคลาส & คำนวณตารางวันเรียนทันที";
          }
        })
        .withFailureHandler(function(err) {
          alert("เกิดข้อผิดพลาด: " + err.message);
          btn.disabled = false;
          btn.innerText = "🚀 สร้างคลาส & คำนวณตารางวันเรียนทันที";
        })
        .createClassFromGenerator(params);
    }

    onInputUpdate();
  </script>
</body>
</html>
